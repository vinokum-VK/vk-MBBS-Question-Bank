<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#grad)" />

  <!-- Outer subtle glowing ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6" />

  <!-- Medical Cross Accent in Center -->
  <g filter="url(#shadow)">
    <!-- Vertical bar -->
    <rect x="232" y="110" width="48" height="292" rx="24" fill="#ffffff" />
    <!-- Horizontal bar -->
    <rect x="110" y="232" width="292" height="48" rx="24" fill="#ffffff" />
  </g>

  <!-- Center Gold Emblem with VK Letters -->
  <circle cx="256" cy="256" r="85" fill="#1e1b4b" stroke="url(#gold)" stroke-width="8" />
  
  <!-- VK MBBS text -->
  <text x="256" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="54" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">VK</text>
  <text x="256" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#fde047" text-anchor="middle" letter-spacing="3">MBBS</text>

  <!-- Stethoscope / Laurel curve subtle accents -->
  <path d="M 170 380 Q 256 430 342 380" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="170" cy="380" r="8" fill="#fde047" />
  <circle cx="342" cy="380" r="8" fill="#fde047" />
</svg>
